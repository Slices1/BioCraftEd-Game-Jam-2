<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Glow Factory PoC</title>
<style>
html,body{margin:0;height:100%;background:#03060c;overflow:hidden;touch-action:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#fps{position:fixed;left:8px;top:6px;font:12px/1 monospace;color:#7ff;opacity:.85;text-shadow:0 0 5px #0ff;pointer-events:none}
#bt{position:fixed;right:10px;top:8px;font:12px/1 monospace;color:#bff;background:rgba(8,24,34,.7);border:1px solid #2fd;border-radius:6px;padding:7px 10px;cursor:pointer;box-shadow:0 0 10px rgba(0,255,255,.35)}
</style></head><body>
<canvas id="c"></canvas><div id="fps">-- fps</div><button id="bt">Bloom: on</button>
<script>
(()=>{
'use strict';
const Q=new URLSearchParams(location.search);
const FIX=Q.has('t')?parseFloat(Q.get('t')):null;
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2,FLOOR=760,RX=520,SX=880;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const hc={};
function hx(h){if(hc[h])return hc[h];const n=parseInt(h.slice(1),16);return hc[h]=[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hx(a),B=hx(b);return`rgb(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0})`}
function rgba(h,a){const A=hx(h);return`rgba(${A[0]},${A[1]},${A[2]},${a})`}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function lg(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);for(const s of st)g.addColorStop(s[0],s[1]);return g}
function rg(c,x,y,r0,r1,st){const g=c.createRadialGradient(x,y,r0,x,y,r1);for(const s of st)g.addColorStop(s[0],s[1]);return g}

/* glow sprites */
const SP={};
function mkSprite(name,col){const k=document.createElement('canvas');k.width=k.height=128;const c=k.getContext('2d');
 const A=hx(col);c.fillStyle=rg(c,64,64,0,64,[[0,`rgba(${A},1)`],[.18,`rgba(${A},.55)`],[.45,`rgba(${A},.16)`],[1,`rgba(${A},0)`]]);c.fillRect(0,0,128,128);SP[name]=k}
[['w','#ffffff'],['c','#3df2ff'],['a','#ffb03a'],['m','#ff3ea5'],['v','#8a7bff'],['r','#ff3b3b'],['g','#4dff9a'],['s','#bfe8ee'],['k','#16384a']].forEach(a=>mkSprite(a[0],a[1]));
function glow(c,n,x,y,r,a){if(a<=.003)return;c.globalAlpha=a>1?1:a;c.drawImage(SP[n],x-r,y-r,r*2,r*2);c.globalAlpha=1}

/* material helpers */
function rivet(c,x,y,r){c.fillStyle='#050a10';c.beginPath();c.arc(x,y,r+.8,0,TAU);c.fill();c.fillStyle='#4b6678';c.beginPath();c.arc(x-.3,y-.3,r,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.arc(x-r*.35,y-r*.35,r*.35,0,TAU);c.fill()}
function metal(c,x,y,w,h,r,base,o){o=o||{};
 const hi=mix(base,'#ffffff',.2),lo=mix(base,'#000000',.5);
 rr(c,x,y,w,h,r);c.fillStyle=lg(c,x,y,x,y+h,[[0,hi],[.3,base],[1,lo]]);c.fill();
 if(o.rim){rr(c,x,y,w,h,r);c.fillStyle=lg(c,x+w,y,x+w*.62,y,[[0,o.rim],[1,'rgba(0,0,0,0)']]);c.fill()}
 if(o.rimL){rr(c,x,y,w,h,r);c.fillStyle=lg(c,x,y,x+w*.4,y,[[0,o.rimL],[1,'rgba(0,0,0,0)']]);c.fill()}
 c.lineWidth=1.3;c.strokeStyle='rgba(255,255,255,.26)';c.beginPath();c.moveTo(x+r,y+.8);c.lineTo(x+w-r,y+.8);c.stroke();
 c.beginPath();c.moveTo(x+.8,y+r);c.lineTo(x+.8,y+h-r);c.strokeStyle='rgba(255,255,255,.12)';c.stroke();
 c.strokeStyle='rgba(0,0,0,.55)';c.beginPath();c.moveTo(x+r,y+h-.7);c.lineTo(x+w-r,y+h-.7);c.stroke();
 rr(c,x,y,w,h,r);c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=1.4;c.stroke();
 if(o.riv){const q=o.riv,rd=Math.max(1.4,Math.min(3,w/50));rivet(c,x+q,y+q,rd);rivet(c,x+w-q,y+q,rd);rivet(c,x+q,y+h-q,rd);rivet(c,x+w-q,y+h-q,rd)}
}
function hpipe(c,x,y,len,th,base){c.fillStyle=lg(c,0,y,0,y+th,[[0,mix(base,'#000',.45)],[.22,mix(base,'#fff',.28)],[.5,base],[1,mix(base,'#000',.65)]]);c.fillRect(x,y,len,th);
 c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x,y+th*.18,len,1.5)}
function vpipe(c,x,y,len,th,base){c.fillStyle=lg(c,x,0,x+th,0,[[0,mix(base,'#000',.45)],[.22,mix(base,'#fff',.28)],[.5,base],[1,mix(base,'#000',.65)]]);c.fillRect(x,y,th,len);
 c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x+th*.18,y,1.5,len)}
function flangeH(c,x,y,th,base){metal(c,x-7,y-4,14,th+8,2,mix(base,'#fff',.1),{});rivet(c,x,y,1.6);rivet(c,x,y+th,1.6)}
function flangeV(c,x,y,th,base){metal(c,x-4,y-7,th+8,14,2,mix(base,'#fff',.1),{});rivet(c,x,y,1.6);rivet(c,x+th,y,1.6)}
function hazard(c,x,y,w,h,a){c.save();rr(c,x,y,w,h,2);c.clip();c.fillStyle='#120f08';c.fillRect(x,y,w,h);c.fillStyle=`rgba(226,160,24,${a})`;
 for(let i=-h;i<w+h;i+=h*1.1){c.beginPath();c.moveTo(x+i,y+h);c.lineTo(x+i+h*.55,y+h);c.lineTo(x+i+h*1.55,y);c.lineTo(x+i+h,y);c.fill()}
 c.restore();rr(c,x,y,w,h,2);c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=1;c.stroke()}
function cable(c,x0,y0,x1,y1,sag,th,col,hl){c.lineCap='round';const mx=(x0+x1)/2,my=Math.max(y0,y1)+sag;
 c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(mx,my,x1,y1);c.strokeStyle='#03060a';c.lineWidth=th+3;c.stroke();
 c.strokeStyle=col;c.lineWidth=th;c.stroke();c.beginPath();c.moveTo(x0-1,y0);c.quadraticCurveTo(mx-1,my-th*.3,x1-1,y1);c.strokeStyle=hl||'rgba(255,255,255,.2)';c.lineWidth=Math.max(1,th*.25);c.stroke()}
function gearPath(r,n,th,holes,hr){const p=new Path2D(),st=TAU/n;
 for(let i=0;i<n;i++){const a=i*st,pts=[[a-st*.3,r],[a-st*.17,r+th],[a+st*.17,r+th],[a+st*.3,r]];
  pts.forEach((q,j)=>{const x=Math.cos(q[0])*q[1],y=Math.sin(q[0])*q[1];(i===0&&j===0)?p.moveTo(x,y):p.lineTo(x,y)})}
 p.closePath();
 for(let k=0;k<holes;k++){const a=k*TAU/holes,x=Math.cos(a)*r*.58,y=Math.sin(a)*r*.58;p.moveTo(x+r*hr,y);p.arc(x,y,r*hr,0,TAU)}
 p.moveTo(r*.14,0);p.arc(0,0,r*.14,0,TAU);return p}
const GEARS=[{x:120,y:250,r:78,n:16,sp:.35,h:5,hr:.16,c:'#1e3342'},{x:208,y:322,r:46,n:10,sp:-.56,h:4,hr:.14,c:'#6a4a26'},{x:1515,y:210,r:96,n:20,sp:-.25,h:6,hr:.17,c:'#1d3442'},{x:1425,y:285,r:44,n:10,sp:.53,h:4,hr:.14,c:'#4a3a2a'}];
GEARS.forEach(g=>g.p=gearPath(g.r,g.n,g.r*.13,g.h,g.hr));
function drawGear(c,g,t){c.save();c.translate(g.x,g.y);c.rotate(t*g.sp);
 c.fillStyle=rg(c,-g.r*.3,-g.r*.3,2,g.r*1.2,[[0,mix(g.c,'#fff',.35)],[.55,g.c],[1,mix(g.c,'#000',.7)]]);c.fill(g.p,'evenodd');
 c.strokeStyle='rgba(0,0,0,.65)';c.lineWidth=1.6;c.stroke(g.p);c.strokeStyle='rgba(180,240,255,.22)';c.lineWidth=1;c.stroke(g.p);
 c.fillStyle='#0b141c';c.beginPath();c.arc(0,0,g.r*.2,0,TAU);c.fill();c.restore()}
function crate(c,x,y,w,h,col){metal(c,x,y,w,h,3,col,{riv:5});c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=2;c.beginPath();c.moveTo(x+6,y+6);c.lineTo(x+w-6,y+h-6);c.moveTo(x+w-6,y+6);c.lineTo(x+6,y+h-6);c.stroke();
 c.strokeStyle='rgba(255,255,255,.14)';c.lineWidth=1;c.strokeRect(x+5.5,y+5.5,w-11,h-11)}
function bz(a,b,c2,d,s){const u=1-s;return[u*u*u*a[0]+3*u*u*s*b[0]+3*u*s*s*c2[0]+s*s*s*d[0],u*u*u*a[1]+3*u*u*s*b[1]+3*u*s*s*c2[1]+s*s*s*d[1]]}
function zap(c,x0,y0,x1,y1,seed,amp,col,w){const R=rng(seed),n=9,dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
 c.lineJoin='round';
 for(const pass of[[w*3.2,.25,col],[w,.95,'#ffffff']]){c.beginPath();c.moveTo(x0,y0);
  const R2=rng(seed);for(let i=1;i<n;i++){const s=i/n,o=(R2()-.5)*2*amp*Math.sin(s*Math.PI);c.lineTo(x0+dx*s+nx*o,y0+dy*s+ny*o)}c.lineTo(x1,y1);
  c.strokeStyle=pass[2];c.globalAlpha=pass[1];c.lineWidth=pass[0];c.stroke()}c.globalAlpha=1}

/* ---------- state / sizing ---------- */
let W,H,DPR,S,CXw,CYw,PS,PORT=false,caches={},bloomOn=Q.get('bloom')!=='0';
const B1=document.createElement('canvas'),b1=B1.getContext('2d'),B2=document.createElement('canvas'),b2=B2.getContext('2d'),B3=document.createElement('canvas'),b3=B3.getContext('2d');
const FILT='filter' in CanvasRenderingContext2D.prototype;
let vig=null,noise=null;
function mk(x0,y0,w,h,ps){const c=document.createElement('canvas');c.width=Math.ceil(w*ps);c.height=Math.ceil(h*ps);const g=c.getContext('2d');g.scale(ps,ps);g.translate(-x0,-y0);return{c,g,x0,y0,w,h}}
function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2);W=Math.round(innerWidth*DPR);H=Math.round(innerHeight*DPR);cv.width=W;cv.height=H;
 const asp=W/H;let vw;if(asp<=1)vw=780;else if(asp>=16/9)vw=1600;else vw=780+820*(asp-1)/(16/9-1);
 S=W/vw;PORT=asp<1.1;CXw=PORT?780:800;CYw=PORT?450:470;PS=Math.min(S,1.4);
 B1.width=Math.max(2,W>>2);B1.height=Math.max(2,H>>2);B2.width=B1.width;B2.height=B1.height;B3.width=Math.max(2,W>>4);B3.height=Math.max(2,H>>4);
 buildCaches();
 vig=document.createElement('canvas');vig.width=256;vig.height=256;const g=vig.getContext('2d');g.fillStyle=rg(g,128,128,50,190,[[0,'rgba(0,0,0,0)'],[.6,'rgba(2,4,10,.28)'],[1,'rgba(1,2,6,.82)']]);g.fillRect(0,0,256,256);
}
/* ---------- far layers ---------- */
const chims=[{x:1240,y:150},{x:1410,y:215},{x:330,y:240},{x:60,y:190}];
function windowsDots(c,R,x,y,w,h,step,dens,cols){for(let yy=y;yy<y+h;yy+=step)for(let xx=x;xx<x+w;xx+=step*.8){if(R()<dens){c.fillStyle=cols[R()*cols.length|0];c.fillRect(xx,yy,step*.38,step*.5)}}}
function buildFarA(g){const R=rng(11);
 g.fillStyle=lg(g,0,0,0,780,[[0,'#03050c'],[.4,'#071a29'],[.78,'#0d3a46'],[1,'#17595c']]);g.fillRect(-160,0,1920,900);
 g.globalCompositeOperation='lighter';glow(g,'a',900,740,700,.32);glow(g,'m',60,560,520,.18);glow(g,'c',1500,420,520,.14);glow(g,'a',1250,260,260,.06);g.globalCompositeOperation='source-over';
 const col='#0c2736',rim='rgba(90,220,230,.28)';
 g.fillStyle=col;
 // cooling towers
 for(const t of[[160,330,200],[560,360,160],[1180,350,190]]){const x=t[0],y=t[1],w=t[2];g.beginPath();g.moveTo(x-w/2,780);g.bezierCurveTo(x-w*.32,y+160,x-w*.28,y+60,x-w*.38,y);g.lineTo(x+w*.38,y);g.bezierCurveTo(x+w*.28,y+60,x+w*.32,y+160,x+w/2,780);g.fill();g.strokeStyle=rim;g.lineWidth=1.5;g.beginPath();g.moveTo(x-w*.38,y);g.lineTo(x+w*.38,y);g.stroke()}
 // tanks
 for(const t of[[400,520,140,260],[820,500,180,280],[1010,540,110,240],[1480,480,160,300]]){g.fillStyle=col;rr(g,t[0]-t[2]/2,t[1],t[2],t[3],8);g.fill();g.beginPath();g.ellipse(t[0],t[1],t[2]/2,t[2]*.2,0,Math.PI,TAU);g.fill();g.strokeStyle=rim;g.lineWidth=1.4;g.beginPath();g.ellipse(t[0],t[1],t[2]/2,t[2]*.2,0,Math.PI,TAU);g.stroke();
  g.fillStyle='rgba(0,0,0,.35)';for(let k=1;k<5;k++)g.fillRect(t[0]-t[2]/2,t[1]+k*t[3]/5,t[2],3)}
 // chimneys
 g.fillStyle=col;for(const m of chims){g.beginPath();g.moveTo(m.x-26,780);g.lineTo(m.x-14,m.y);g.lineTo(m.x+14,m.y);g.lineTo(m.x+26,780);g.fill();g.fillStyle='#4a1a22';g.fillRect(m.x-14,m.y+10,28,10);g.fillStyle='#d8d8d8';g.globalAlpha=.25;g.fillRect(m.x-15,m.y+30,30,10);g.globalAlpha=1;g.fillStyle=col;g.strokeStyle=rim;g.lineWidth=1.2;g.beginPath();g.moveTo(m.x-14,m.y);g.lineTo(m.x+14,m.y);g.stroke()}
 // lattice towers
 for(const x of[290,960,1330]){g.strokeStyle=col;g.lineWidth=5;g.beginPath();g.moveTo(x-50,780);g.lineTo(x-8,300);g.moveTo(x+50,780);g.lineTo(x+8,300);g.stroke();g.lineWidth=2.5;for(let y=780;y>320;y-=44){const k=(780-y)/480,hw=50-42*k;g.beginPath();g.moveTo(x-hw,y);g.lineTo(x+hw-4,y-44);g.moveTo(x+hw,y);g.lineTo(x-hw+4,y-44);g.moveTo(x-hw,y);g.lineTo(x+hw,y);g.stroke()}}
 windowsDots(g,R,380,560,80,200,16,.22,['#ffb03a','#3df2ff']);windowsDots(g,R,740,530,160,240,16,.18,['#ffb03a','#3df2ff','#ff3ea5']);
 // haze
 g.fillStyle=lg(g,0,380,0,790,[[0,'rgba(30,120,130,0)'],[1,'rgba(40,150,150,.42)']]);g.fillRect(-160,380,1920,420);
}
const farLights=[];
function buildFarB(g){const R=rng(23),col='#071a29',rim='rgba(255,170,70,.25)';
 g.fillStyle=col;
 // factory halls with sawtooth roofs
 for(const h of[[-120,640,360,170],[330,610,300,200],[760,630,330,180],[1180,600,320,210],[1500,640,300,170]]){
  g.beginPath();g.moveTo(h[0],780);g.lineTo(h[0],h[1]);for(let x=h[0];x<h[0]+h[2];x+=56){g.lineTo(x+4,h[1]-34);g.lineTo(x+56,h[1])}g.lineTo(h[0]+h[2],780);g.closePath();g.fill();
  g.strokeStyle=rim;g.lineWidth=1.4;g.beginPath();g.moveTo(h[0],h[1]);for(let x=h[0];x<h[0]+h[2];x+=56){g.lineTo(x+4,h[1]-34);g.lineTo(x+56,h[1])}g.stroke();
  g.fillStyle='#ffb03a';g.globalAlpha=.8;for(let x=h[0]+20;x<h[0]+h[2]-30;x+=48){if(R()<.7){g.fillStyle=R()<.7?'#ffb03a':'#3df2ff';g.fillRect(x,h[1]+34,26,12)}}g.globalAlpha=1;g.fillStyle=col}
 // catwalk
 g.strokeStyle=col;g.lineWidth=7;g.beginPath();g.moveTo(-100,470);g.lineTo(1700,470);g.stroke();g.lineWidth=2.5;g.beginPath();g.moveTo(-100,440);g.lineTo(1700,440);g.stroke();
 for(let x=-100;x<1700;x+=36){g.lineWidth=2;g.beginPath();g.moveTo(x,440);g.lineTo(x,470);g.stroke()}
 for(let x=-60;x<1700;x+=230){g.lineWidth=7;g.beginPath();g.moveTo(x,470);g.lineTo(x,790);g.stroke();g.lineWidth=2.5;g.beginPath();g.moveTo(x,480);g.lineTo(x+230,640);g.moveTo(x+230,480);g.lineTo(x,640);g.stroke()}
 g.strokeStyle='rgba(60,200,220,.22)';g.lineWidth=1.3;g.beginPath();g.moveTo(-100,468);g.lineTo(1700,468);g.stroke();
 // big pipes
 g.fillStyle=col;g.fillRect(-100,540,1800,26);g.fillRect(-100,578,1800,12);
 g.fillStyle=lg(g,0,380,0,790,[[0,'rgba(30,120,130,0)'],[1,'rgba(30,130,140,.3)']]);g.fillRect(-160,380,1920,420);
 for(const m of chims)farLights.push(m);
}
/* ---------- mid (world plane) ---------- */
function girder(c,x,y0,y1,w){const h=y1-y0;
 c.fillStyle=lg(c,x,0,x+w,0,[[0,'#0a141d'],[.5,'#12222e'],[1,'#0a141d']]);c.fillRect(x+10,y0,w-20,h);
 c.strokeStyle='#223a4a';c.lineWidth=5;for(let y=y0+40;y<y1-120;y+=130){c.beginPath();c.moveTo(x+12,y);c.lineTo(x+w-12,y+90);c.moveTo(x+w-12,y);c.lineTo(x+12,y+90);c.stroke()}
 metal(c,x,y0,14,h,3,'#2c4658',{rimL:'rgba(61,242,255,.22)'});metal(c,x+w-14,y0,14,h,3,'#223847',{rim:'rgba(255,176,58,.16)'});
 for(let y=y0+14;y<y1;y+=34){rivet(c,x+7,y,1.8);rivet(c,x+w-7,y,1.8)}
 metal(c,x-12,y1-14,w+24,14,3,'#2c4658',{riv:4});hazard(c,x-4,y1-110,w+8,60,.7)}
function lamp(c,x,y,col){c.strokeStyle='#05090e';c.lineWidth=3;c.beginPath();c.moveTo(x,78);c.lineTo(x,y);c.stroke();
 c.fillStyle=lg(c,x-26,0,x+26,0,[[0,'#101c26'],[.4,'#3a5568'],[1,'#0a121a']]);c.beginPath();c.moveTo(x-10,y);c.lineTo(x+10,y);c.lineTo(x+30,y+26);c.lineTo(x-30,y+26);c.closePath();c.fill();c.strokeStyle='rgba(0,0,0,.6)';c.stroke();
 c.fillStyle=col==='a'?'#ffe2a8':'#c8fcff';rr(c,x-22,y+23,44,6,3);c.fill();
 // cone
 const cc=col==='a'?'255,176,58':'61,242,255';c.globalCompositeOperation='lighter';
 c.fillStyle=lg(c,0,y+26,0,FLOOR,[[0,`rgba(${cc},.2)`],[1,`rgba(${cc},0)`]]);c.beginPath();c.moveTo(x-24,y+28);c.lineTo(x+24,y+28);c.lineTo(x+170,FLOOR);c.lineTo(x-170,FLOOR);c.closePath();c.fill();
 glow(c,col,x,y+30,70,.55);c.save();c.translate(x,FLOOR);c.scale(1,.12);glow(c,col,0,0,220,.4);c.restore();c.globalCompositeOperation='source-over'}
function buildMid(g){const R=rng(7);
 g.fillStyle=lg(g,0,0,0,760,[[0,'#0a1620'],[.5,'#0f2535'],[1,'#0b1b27']]);g.fillRect(-80,0,1760,FLOOR);
 for(let gy=0;gy<5;gy++)for(let gx=-1;gx<9;gx++){const x=gx*200+5,y=100+gy*132,t=R();
