<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16161d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>CORVID</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #16161d; --fg: #f4f4f8; --accent: #ffd166; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { position: fixed; inset: 0; }
  canvas {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    display: block; touch-action: none; outline: none;
    -webkit-user-drag: none; -webkit-touch-callout: none;
  }
  .layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; touch-action: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #gl { pointer-events: none; }
  #loading { z-index: 30; background: var(--bg); font-size: 15px; opacity: .85; }
  .spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.18); border-top-color: var(--fg);
    border-radius: 50%; animation: spin .8s linear infinite; }
  #start { z-index: 10; background: var(--bg); cursor: pointer; }
  #start .big { font-size: clamp(34px, 10vmin, 72px); font-weight: 800; letter-spacing: .02em; color: var(--accent); }
  #start .hint { font-size: clamp(16px, 3.6vmin, 24px); font-weight: 700; color: var(--fg); animation: pulse 1.4s ease-in-out infinite; }
  #hud { position: fixed; z-index: 20; display: flex; gap: 8px;
    top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); }
  #hud button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; cursor: pointer;
    background: rgba(0,0,0,.38); color: #fff; display: grid; place-items: center; touch-action: manipulation; }
  #hud button:focus { outline: none; }
  #hud button:focus-visible { outline: 2px solid var(--accent); }
  #hud svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #hud .off { display: none; }
  #hud button[aria-pressed="true"] .on { display: none; }
  #hud button[aria-pressed="true"] .off { display: inline; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .45; } }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="game" tabindex="-1" aria-label="Game"></canvas>

<div id="loading" class="layer" role="status"><div class="spinner"></div><div id="loading-text">Loading…</div></div>

<div id="start" class="layer" hidden>
  <div class="big" id="start-title"></div>
  <div class="hint" id="start-hint">Tap to start</div>
</div>

<div id="hud">
  <button id="btn-pause" type="button" tabindex="-1" aria-label="Pause" hidden>
    <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
  </button>
  <button id="btn-mute" type="button" tabindex="-1" aria-label="Mute" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
  <button id="btn-fs" type="button" tabindex="-1" aria-label="Fullscreen" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24"><path class="on" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="off" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
  </button>
</div>

<script>
  // Boot watchdog: show something useful instead of a spinner forever.
  (function () {
    function fail(msg) {
      if (window.__gameBooted) return;
      var t = document.getElementById('loading-text');
      if (t) t.textContent = msg;
      var s = document.querySelector('#loading .spinner');
      if (s) s.style.display = 'none';
    }
    window.__bootFail = fail;
    window.addEventListener('error', function (e) { fail('Error: ' + (e.message || 'failed to load')); });
    setTimeout(function () { fail('Still loading… if this persists, please reload.'); }, 15000);
  })();
</script>
<script nomodule>document.getElementById('loading-text').textContent = 'Sorry, this browser is too old to run the game.';</script>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module" src="src/main.js" onerror="window.__bootFail && window.__bootFail('Could not load the game (serve this folder over http).')"></script>
</body>
</html>
